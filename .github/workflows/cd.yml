name: deploy to ec2
on:
    workflow_run:
        workflows:
            - type: completed

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: deploy to ec2
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{secrets.EC2_HOST}}
                username: ${{secrets.EC2_USERNAME}}
                key: ${{secrets.EC2_KEY}}
                script: |
                  sudo docker pull aditya0005/node-app:latest
                  sudo docker rm -f node-app || true
                  sudo docker run -d -p 3000:3000 --name node-app aditya0005/node-app:latest